name: Verify iPad STRM repair

on:
  push:
    branches: [chatgpt/ios-strm-repair-20261107]
    paths: [.github/workflows/ios-strm-repair.yml]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ios-strm-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_REVISION: 67323de285b00232883f53b84095eb72be97d35c

jobs:
  native-regression:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded native test and failure-evidence changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('ios/RunnerTests/RunnerTests.swift')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == '532788b5fb208804619bf1ee3a9396beb426cab2'
          text = p.read_text()
          start = text.index('  func testControlledStrmInputDecodesSeeksAndResumes() throws {')
          end = text.index('  private func strmFixtureVideo()', start)
          replacement = Path('.github/repairs/ios-strm-method.swift').read_text()
          p.write_text(text[:start] + replacement + '\n' + text[end:])
          p = Path('.github/workflows/ios-core.yml')
          assert subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip() == '675acef6beadbb0fd49a1d03dbab11bbb5512cd5'
          text = p.read_text()
          anchor = '      - name: Generate Runner entitlement mirrors\n'
          assert text.count(anchor) == 1
          addition = '''      - name: Preserve native XCTest evidence on success or failure
                  if: always()
                  shell: bash
                  run: |
                    set -euo pipefail
                    evidence='build/ios/xctest-evidence'
                    result_bundle="$RUNNER_TEMP/runner-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult"
                    xctest_log="$RUNNER_TEMP/runner-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
                    mkdir -p "$evidence"
                    if [[ -f "$xctest_log" ]]; then
                      cp "$xctest_log" "$evidence/runner-tests.log"
                    fi
                    if [[ -d "$result_bundle" ]]; then
                      ditto -c -k --keepParent "$result_bundle" "$evidence/runner-tests.xcresult.zip"
                      xcrun xcresulttool get test-results summary --path "$result_bundle" > "$evidence/summary.json"
                      cat "$evidence/summary.json"
                    fi

                - name: Upload native XCTest evidence
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ios-xctest-${{ github.run_number }}-${{ github.run_attempt }}
                    if-no-files-found: ignore
                    retention-days: 14
                    path: build/ios/xctest-evidence/

          '''
          p.write_text(text.replace(anchor, addition + anchor, 1))
          PY
          git diff --check
          ruby -ryaml -e 'YAML.load_file(".github/workflows/ios-core.yml"); puts "Production workflow YAML parsed"'
          git diff --stat
      - name: Select the production Xcode version
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Install the production Flutter revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
          bundler-cache: true
      - name: Prepare locked dependencies and pinned mpv headers
        run: |
          flutter pub get --enforce-lockfile
          python3 scripts/ios/prepare_media_kit_headers.py --evidence build/ios/artifacts/mpv-headers/prepare
          (cd ios && bundle exec pod install --deployment)
          python3 scripts/ios/prepare_media_kit_headers.py --verify-pods ios/Pods --evidence build/ios/artifacts/mpv-headers/pods
          git diff --exit-code -- pubspec.lock ios/Podfile.lock
      - name: Prepare the same iPad simulator as production
        run: |
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next((x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")), ""))')"
          test -n "$runtime_id"
          device_id="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; items=json.load(sys.stdin)["devicetypes"]; print(next((x["identifier"] for x in items if x["name"] == "iPad (10th generation)"), next(x["identifier"] for x in items if x.get("productFamily") == "iPad")))')"
          udid="$(xcrun simctl create 'iPad STRM Verification' "$device_id" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Require three consecutive native STRM regression passes
        working-directory: ios
        run: |
          for iteration in 1 2 3; do
            xcodebuild test \
              -workspace Runner.xcworkspace -scheme Runner -configuration Debug \
              -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
              -resultBundlePath "$RUNNER_TEMP/strm-fixed-$iteration.xcresult" \
              -only-testing:RunnerTests/RunnerTests/testControlledStrmInputDecodesSeeksAndResumes \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/strm-fixed-$iteration.log"
          done
      - name: Run the full production native suite and capability evidence gates
        run: |
          ruby -ryaml -e 'w=YAML.load_file(".github/workflows/ios-core.yml"); s=w.fetch("jobs").fetch("ios-device-build").fetch("steps").find { |x| x["name"] == "Run native diagnostics and libmpv capability XCTest" }; abort "Missing production test step" unless s; puts s.fetch("run")' > "$RUNNER_TEMP/production-native-test.sh"
          (cd ios && bash -e -o pipefail "$RUNNER_TEMP/production-native-test.sh")
      - name: Preserve all native results and the exact source patch
        if: always()
        run: |
          evidence='build/ios/strm-repair-evidence'
          mkdir -p "$evidence/source/ios/RunnerTests" "$evidence/source/.github/workflows"
          cp ios/RunnerTests/RunnerTests.swift "$evidence/source/ios/RunnerTests/"
          cp .github/workflows/ios-core.yml "$evidence/source/.github/workflows/"
          git rev-parse HEAD > "$evidence/head.txt"
          git diff -- ios/RunnerTests/RunnerTests.swift .github/workflows/ios-core.yml > "$evidence/repair.patch"
          for log in "$RUNNER_TEMP"/strm-fixed-*.log "$RUNNER_TEMP"/runner-tests-*.log; do
            [[ ! -f "$log" ]] || cp "$log" "$evidence/"
          done
          for bundle in "$RUNNER_TEMP"/strm-fixed-*.xcresult "$RUNNER_TEMP"/runner-tests-*.xcresult; do
            [[ -d "$bundle" ]] || continue
            name="$(basename "$bundle" .xcresult)"
            ditto -c -k --keepParent "$bundle" "$evidence/$name.xcresult.zip"
            xcrun xcresulttool get test-results summary --path "$bundle" > "$evidence/$name-summary.json"
            cat "$evidence/$name-summary.json"
          done
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-strm-repair-evidence
          path: build/ios/strm-repair-evidence/
          include-hidden-files: true
          retention-days: 7
      - name: Commit only after repeated and full native verification passes
        run: |
          git config user.name 'ChatGPT Web'
          git config user.email 'chatgpt-web@users.noreply.github.com'
          git add ios/RunnerTests/RunnerTests.swift .github/workflows/ios-core.yml
          git commit -m 'test(ios): synchronize native STRM loading and preserve XCTest failure evidence' -m 'ChatGPT Web: require actual file loading and completed stopping before subsequent seeks; reject stale positions; retain phase snapshots and raw XCTest results. Verified using three consecutive native STRM runs and the complete production native suite plus its capability evidence gates. Production packaging and physical-device playback are not verified by this run.'
          git push origin HEAD:refs/heads/chatgpt/ios-strm-repair-20261107
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
