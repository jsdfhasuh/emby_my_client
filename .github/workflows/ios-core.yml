name: iOS Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/ios-core-adaptation
      - agent/ios-core-real-device-remediation
  pull_request:
    paths:
      - '.metadata'
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'scripts/android/**'
      - 'scripts/ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/ios-core.yml'
      - 'docs/plans/**'
      - 'docs/acceptance/**'
      - 'docs/implementation/**'

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_REVISION: 67323de285b00232883f53b84095eb72be97d35c
  DART_VERSION: 3.10.8
  COCOAPODS_VERSION: 1.16.2
  LDID_VERSION: 2.1.5
  ANDROID_NDK_VERSION: 28.2.13676358
  IMPLEMENTATION_START_HEAD: 61e124660c51dfee6fe91b778f46d39bd78a447a

jobs:
  quality-and-android:
    name: Quality and Android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify protected files are unchanged from implementation start
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$IMPLEMENTATION_START_HEAD"
          git diff --exit-code "$IMPLEMENTATION_START_HEAD" -- \
            .metadata \
            pubspec.yaml \
            pubspec.lock \
            ios/Podfile \
            ios/Podfile.lock \
            ios/Runner/Info.plist \
            ':(glob)ios/**/*.entitlements' \
            scripts/ios/runner-entitlements.plist \
            scripts/ios/trollstore-entitlements.plist \
            Gemfile \
            Gemfile.lock

      - name: Install fixed Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_dir"
          git -C "$flutter_dir" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$flutter_dir" checkout --detach "$FLUTTER_REVISION"
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_dir" >> "$GITHUB_ENV"
          "$flutter_dir/bin/flutter" precache --android

      - name: Report fixed toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          dart_version="$(dart --version 2>&1)"
          case "$dart_version" in
            *"$DART_VERSION"*) ;;
            *) echo "Expected Dart $DART_VERSION, got: $dart_version" >&2; exit 1 ;;
          esac

      - name: Resolve Dart dependencies without lock drift
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Validate Android and iOS shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/android/*.sh
          bash -n scripts/ios/*.sh
          shellcheck --version
          shellcheck scripts/android/*.sh
          shellcheck scripts/ios/*.sh

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          flutter build apk --debug --split-per-abi

      - name: Run Android native libmpv capability smoke test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_paths < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name 'app*-debug.apk' -print | sort)
          test "${#apk_paths[@]}" -ge 4
          bash scripts/android/verify_mpv_capabilities.sh "${apk_paths[@]}"

      - name: Run startable Android libmpv smoke test
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          yes | "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ANDROID_NDK_VERSION" \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          export PATH="$android_sdk_root/platform-tools:$PATH"
          echo no | "$android_sdk_root/cmdline-tools/latest/bin/avdmanager" \
            create avd --force \
            --name emby-mpv-capability \
            --package 'system-images;android-35;google_apis;x86_64'
          "$android_sdk_root/emulator/emulator" \
            -avd emby-mpv-capability \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect >"$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            adb emu kill >/dev/null 2>&1 || true
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup_emulator EXIT
          adb wait-for-device
          booted=''
          for _ in $(seq 1 180); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "$booted" == '1' ]] && break
            sleep 2
          done
          if [[ "$booted" != '1' ]]; then
            cat "$RUNNER_TEMP/android-emulator.log" >&2
            exit 1
          fi
          ANDROID_NDK_HOME="$android_sdk_root/ndk/$ANDROID_NDK_VERSION" \
            bash scripts/android/run_mpv_startability_probe.sh \
              build/app/outputs/flutter-apk/app-x86_64-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Android split-per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-split-apks-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-*-debug.apk

  ios-device-build:
    name: iPadOS device IPA
    needs: quality-and-android
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify protected files are unchanged from implementation start
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$IMPLEMENTATION_START_HEAD"
          git diff --exit-code "$IMPLEMENTATION_START_HEAD" -- \
            .metadata \
            pubspec.yaml \
            pubspec.lock \
            ios/Podfile \
            ios/Podfile.lock \
            ios/Runner/Info.plist \
            ':(glob)ios/**/*.entitlements' \
            scripts/ios/runner-entitlements.plist \
            scripts/ios/trollstore-entitlements.plist \
            Gemfile \
            Gemfile.lock

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          xcode_app='/Applications/Xcode_16.4.app'
          test -d "$xcode_app"
          sudo xcode-select --switch "$xcode_app"
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = '16.4'

      - name: Install fixed Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_dir"
          git -C "$flutter_dir" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$flutter_dir" checkout --detach "$FLUTTER_REVISION"
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_dir" >> "$GITHUB_ENV"
          "$flutter_dir/bin/flutter" precache --ios

      - name: Set up Ruby and locked CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
          bundler-cache: true

      - name: Report Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version
          sw_vers
          ruby --version
          bundle exec pod --version
          test "$(bundle exec pod --version)" = "$COCOAPODS_VERSION"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          dart_version="$(dart --version 2>&1)"
          case "$dart_version" in
            *"$DART_VERSION"*) ;;
            *) echo "Expected Dart $DART_VERSION, got: $dart_version" >&2; exit 1 ;;
          esac

      - name: Resolve Dart dependencies without lock drift
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Install CocoaPods with deployment lock
        working-directory: ios
        run: bundle exec pod install --deployment

      - name: Check CocoaPods lock drift
        run: git diff --exit-code -- ios/Podfile.lock

      - name: Prepare iPad Simulator destination
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(
            xcrun simctl list runtimes -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((item["identifier"] for item in data["runtimes"] if item.get("isAvailable") and item.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")), ""))'
          )"
          if [[ -z "$runtime_id" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime_id="$(
              xcrun simctl list runtimes -j |
                python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((item["identifier"] for item in data["runtimes"] if item.get("isAvailable") and item.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")), ""))'
            )"
          fi
          test -n "$runtime_id"

          device_type_id="$(
            xcrun simctl list devicetypes -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); types = data["devicetypes"]; exact = next((item for item in types if item.get("name") == "iPad (10th generation)"), None); fallback = next((item for item in types if item.get("productFamily") == "iPad" or item.get("name", "").startswith("iPad")), None); print((exact or fallback or {}).get("identifier", ""))'
          )"
          test -n "$device_type_id"

          simulator_udid="$(xcrun simctl create 'iPad Safe Diagnostics' "$device_type_id" "$runtime_id")"
          test -n "$simulator_udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run native diagnostics and libmpv capability XCTest
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/runner-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult"
          attachment_dir="$RUNNER_TEMP/runner-test-attachments-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$attachment_dir"
          mkdir -p ../build/ios/artifacts
          ATTACHMENT_DIR="$attachment_dir" \
            CAPABILITY_OUTPUT='../build/ios/artifacts/mpv-capability-manifest.json' \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          source_root = Path(os.environ['ATTACHMENT_DIR'])
          output = Path(os.environ['CAPABILITY_OUTPUT'])
          manifest = None
          for candidate in source_root.rglob('*'):
              if not candidate.is_file():
                  continue
              try:
                  decoded = json.loads(candidate.read_text())
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if decoded.get('schema') == 'emby-mpv-capabilities/v1':
                  manifest = decoded
                  output.write_bytes(candidate.read_bytes())
                  break
          assert manifest is not None
          assert manifest['schema'] == 'emby-mpv-capabilities/v1'
          assert manifest['diskCapabilityPassed'] is True
          assert manifest['profileSwitchStrategy'] in {
              'inPlaceAfterMediaStop', 'requiresPlayerRecreation'
          }
          assert all(manifest['options'].values())
          assert manifest['resetValues']['demuxer-cache-dir'] == ''
          print(json.dumps(manifest, sort_keys=True, separators=(',', ':')))
          PY

      - name: Generate Runner entitlement mirrors
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/sync_entitlements.sh --runner-files
          git diff --exit-code -- \
            ios/Runner/DebugProfile.entitlements \
            ios/Runner/Release.entitlements

      - name: Validate iPad project settings and entitlements
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/validate_project_settings.sh
          bash scripts/ios/validate_entitlements.sh --xcode

      - name: Build unsigned device Runner.app
        run: bundle exec flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Check lock drift after iOS build
        shell: bash
        run: git diff --exit-code -- pubspec.lock ios/Podfile.lock

      - name: Install and verify Homebrew Core ldid 2.1.5
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/install_ldid.sh
          bash scripts/ios/verify_ldid.sh

      - name: Run packaging negative gates
        shell: bash
        run: bash scripts/ios/test_packaging_negative_gates.sh

      - name: Run entitlement policy negative gates
        shell: bash
        run: bash scripts/ios/test_entitlement_policy_negative_gates.sh

      - name: Create and verify TrollStore IPA
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          MPV_CAPABILITY_MANIFEST: build/ios/artifacts/mpv-capability-manifest.json
        run: bash scripts/ios/build_trollstore_ipa.sh

      - name: Verify portable IPA checksum
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios/artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          bash scripts/ios/verify_ipa_checksum.sh "$ipa_path" "$ipa_path.sha256"

      - name: Upload IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-ipa-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/ios/artifacts/*.ipa
            build/ios/artifacts/*.ipa.sha256

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-dsym-${{ github.run_number }}
          if-no-files-found: error
          path: build/ios/artifacts/*.dSYM.zip

      - name: Upload diagnostics and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-diagnostics-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/ios/artifacts/*-diagnostics-*.zip
            build/ios/artifacts/*.txt
            build/ios/artifacts/*.json
            build/ios/artifacts/*.plist
            build/ios/artifacts/entitlements-fakesign/**
            build/ios/artifacts/entitlements-final/**
