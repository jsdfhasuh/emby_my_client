name: iOS Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/ios-core-adaptation
      - agent/ios-core-real-device-remediation
  pull_request:
    paths:
      - '.metadata'
      - 'lib/**'
      - 'test/**'
      - 'ios/**'
      - 'scripts/android/**'
      - 'scripts/ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/ios-core.yml'
      - 'docs/plans/**'
      - 'docs/acceptance/**'
      - 'docs/implementation/**'

concurrency:
  group: ios-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_REVISION: 67323de285b00232883f53b84095eb72be97d35c
  DART_VERSION: 3.10.8
  COCOAPODS_VERSION: 1.16.2
  LDID_VERSION: 2.1.5
  ANDROID_NDK_VERSION: 28.2.13676358
  IMPLEMENTATION_START_HEAD: 7f985810656b07e40bef746140e64af7b558e043

jobs:
  quality-and-android:
    name: Quality and Android
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify protected files are unchanged from implementation start
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$IMPLEMENTATION_START_HEAD"
          git diff --exit-code "$IMPLEMENTATION_START_HEAD" -- \
            .metadata \
            pubspec.yaml \
            pubspec.lock \
            ios/Podfile \
            ios/Podfile.lock \
            ios/Runner/Info.plist \
            ':(glob)ios/**/*.entitlements' \
            scripts/ios/runner-entitlements.plist \
            scripts/ios/trollstore-entitlements.plist \
            Gemfile \
            Gemfile.lock

      - name: Install fixed Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_dir"
          git -C "$flutter_dir" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$flutter_dir" checkout --detach "$FLUTTER_REVISION"
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_dir" >> "$GITHUB_ENV"
          "$flutter_dir/bin/flutter" precache --android

      - name: Report fixed toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          dart_version="$(dart --version 2>&1)"
          case "$dart_version" in
            *"$DART_VERSION"*) ;;
            *) echo "Expected Dart $DART_VERSION, got: $dart_version" >&2; exit 1 ;;
          esac

      - name: Resolve Dart dependencies without lock drift
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Install shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Validate Android and iOS shell scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/android/*.sh
          bash -n scripts/ios/*.sh
          shellcheck --version
          shellcheck scripts/android/*.sh
          shellcheck scripts/ios/*.sh

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify playback cache event safety
        run: >-
          flutter test
          test/playback_cache_evidence_test.dart
          test/playback_diagnostics_test.dart

      - name: Build Android debug APKs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          flutter build apk --debug --split-per-abi

      - name: Run Android native libmpv capability smoke test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_paths < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name 'app*-debug.apk' -print | sort)
          test "${#apk_paths[@]}" -ge 4
          bash scripts/android/verify_mpv_capabilities.sh "${apk_paths[@]}"

      - name: Run startable Android libmpv smoke test
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          yes | "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ANDROID_NDK_VERSION" \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          export PATH="$android_sdk_root/platform-tools:$PATH"
          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo no | "$android_sdk_root/cmdline-tools/latest/bin/avdmanager" \
            create avd --force \
            --name emby-mpv-capability \
            --package 'system-images;android-35;google_apis;x86_64'
          "$android_sdk_root/emulator/emulator" -list-avds | grep -Fx emby-mpv-capability
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          "$android_sdk_root/emulator/emulator" \
            -avd emby-mpv-capability \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect >"$RUNNER_TEMP/android-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            adb emu kill >/dev/null 2>&1 || true
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup_emulator EXIT
          device_ready=''
          for _ in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/android-emulator.log" >&2
              exit 1
            fi
            if adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" { found=1 } END { exit !found }'; then
              device_ready='1'
              break
            fi
            sleep 2
          done
          if [[ "$device_ready" != '1' ]]; then
            cat "$RUNNER_TEMP/android-emulator.log" >&2
            exit 1
          fi
          booted=''
          for _ in $(seq 1 180); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [[ "$booted" == '1' ]] && break
            sleep 2
          done
          if [[ "$booted" != '1' ]]; then
            cat "$RUNNER_TEMP/android-emulator.log" >&2
            exit 1
          fi
          ANDROID_NDK_HOME="$android_sdk_root/ndk/$ANDROID_NDK_VERSION" \
            bash scripts/android/run_mpv_startability_probe.sh \
              build/app/outputs/flutter-apk/app-x86_64-debug.apk \
              build/android/artifacts/android-mpv-capability-manifest.json

      - name: Verify Android mpv semantic evidence safety
        shell: bash
        run: |
          set -euo pipefail
          evidence='build/android/artifacts/android-mpv-capability-manifest.json'
          test -s "$evidence"
          python3 - "$evidence" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          value = Path(sys.argv[1]).read_text(encoding='utf-8')
          manifest = json.loads(value)
          forbidden = re.compile(
              r'https?%3a|https?://|authorization|bearer|basic|token|password|'
              r'username|device[_-]?id|item[_-]?id|/data/|/private/|/users/|'
              r'[a-z]:\\|(?:^|[^0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?:[^0-9]|$)',
              re.IGNORECASE,
          )
          assert forbidden.search(value) is None
          assert manifest['activeContextGate'] == 'NOT_RUN'
          assert manifest['diskTelemetryEvidenceGate'] == 'NOT_RUN'
          assert manifest['optionBindingGate'] == 'PASSED'
          assert manifest['memoryProfileGate'] == 'PASSED'
          assert manifest['disabledProfileGate'] == 'PASSED'
          print('STOP_GATE_CACHE_OPTION_BINDING_IMPLEMENTATION=PASSED')
          print('STOP_GATE_MEMORY_CACHE_PROFILE=PASSED')
          print('ANDROID_ACTIVE_CONTEXT_GATE=NOT_RUN')
          print('ANDROID_DISK_TELEMETRY_EVIDENCE_GATE=NOT_RUN')
          PY

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/android/artifacts/android-mpv-capability-manifest.json

      - name: Upload Android split-per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-split-apks-${{ github.run_number }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-*-debug.apk

  ios-device-build:
    name: iPadOS device IPA
    needs: quality-and-android
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify protected files are unchanged from implementation start
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$IMPLEMENTATION_START_HEAD"
          git diff --exit-code "$IMPLEMENTATION_START_HEAD" -- \
            .metadata \
            pubspec.yaml \
            pubspec.lock \
            ios/Podfile \
            ios/Podfile.lock \
            ios/Runner/Info.plist \
            ':(glob)ios/**/*.entitlements' \
            scripts/ios/runner-entitlements.plist \
            scripts/ios/trollstore-entitlements.plist \
            Gemfile \
            Gemfile.lock

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          xcode_app='/Applications/Xcode_16.4.app'
          test -d "$xcode_app"
          sudo xcode-select --switch "$xcode_app"
          xcodebuild -version
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = '16.4'

      - name: Install fixed Flutter revision
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_dir"
          git -C "$flutter_dir" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$flutter_dir" checkout --detach "$FLUTTER_REVISION"
          test "$(git -C "$flutter_dir" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$flutter_dir" >> "$GITHUB_ENV"
          "$flutter_dir/bin/flutter" precache --ios

      - name: Set up Ruby and locked CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler: '2.5.22'
          bundler-cache: true

      - name: Report Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version
          sw_vers
          ruby --version
          bundle exec pod --version
          test "$(bundle exec pod --version)" = "$COCOAPODS_VERSION"
          test "$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" = "$FLUTTER_REVISION"
          dart_version="$(dart --version 2>&1)"
          case "$dart_version" in
            *"$DART_VERSION"*) ;;
            *) echo "Expected Dart $DART_VERSION, got: $dart_version" >&2; exit 1 ;;
          esac

      - name: Resolve Dart dependencies without lock drift
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Install CocoaPods with deployment lock
        working-directory: ios
        run: bundle exec pod install --deployment

      - name: Check CocoaPods lock drift
        run: git diff --exit-code -- ios/Podfile.lock

      - name: Prepare iPad Simulator destination
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(
            xcrun simctl list runtimes -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((item["identifier"] for item in data["runtimes"] if item.get("isAvailable") and item.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")), ""))'
          )"
          if [[ -z "$runtime_id" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime_id="$(
              xcrun simctl list runtimes -j |
                python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((item["identifier"] for item in data["runtimes"] if item.get("isAvailable") and item.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS-")), ""))'
            )"
          fi
          test -n "$runtime_id"

          device_type_id="$(
            xcrun simctl list devicetypes -j |
              python3 -c 'import json, sys; data = json.load(sys.stdin); types = data["devicetypes"]; exact = next((item for item in types if item.get("name") == "iPad (10th generation)"), None); fallback = next((item for item in types if item.get("productFamily") == "iPad" or item.get("name", "").startswith("iPad")), None); print((exact or fallback or {}).get("identifier", ""))'
          )"
          test -n "$device_type_id"

          simulator_udid="$(xcrun simctl create 'iPad Safe Diagnostics' "$device_type_id" "$runtime_id")"
          test -n "$simulator_udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run native diagnostics and libmpv capability XCTest
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/runner-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcresult"
          attachment_dir="$RUNNER_TEMP/runner-test-attachments-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          xctest_log="$RUNNER_TEMP/runner-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          mkdir -p ../build/ios/artifacts
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$xctest_log"
          if grep -Eq 'STOP_GATE_CACHE_OPTION_ALIAS|STOP_GATE_CACHE_TELEMETRY=' "$xctest_log"; then
            echo 'Deprecated cache Gate name was emitted' >&2
            exit 1
          fi
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$attachment_dir"
          ATTACHMENT_DIR="$attachment_dir" \
            CAPABILITY_OUTPUT='../build/ios/artifacts/mpv-capability-manifest.json' \
            GATE_OUTPUT='../build/ios/artifacts/mpv-native-gates.txt' \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          source_root = Path(os.environ['ATTACHMENT_DIR'])
          output = Path(os.environ['CAPABILITY_OUTPUT'])
          gate_output = Path(os.environ['GATE_OUTPUT'])
          def is_capability_manifest(value):
              return (
                  isinstance(value, dict)
                  and value.get('schema') == 'emby-mpv-capabilities/v1'
              )
          def is_gate_manifest(value):
              return (
                  isinstance(value, dict)
                  and value.get('schema') == 'emby-mpv-native-gates/v1'
              )
          assert not is_capability_manifest([])
          assert not is_gate_manifest([])
          capability_matches = []
          gate_matches = []
          for candidate in source_root.rglob('*'):
              if not candidate.is_file():
                  continue
              try:
                  decoded = json.loads(candidate.read_text())
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if is_capability_manifest(decoded):
                  capability_matches.append((decoded, candidate.read_bytes()))
              if is_gate_manifest(decoded):
                  gate_matches.append(decoded)
          assert len(capability_matches) == 1
          assert len(gate_matches) == 1
          manifest, manifest_bytes = capability_matches[0]
          gates = gate_matches[0]
          output.write_bytes(manifest_bytes)
          expected_top = {
              'schema', 'mpvVersionFingerprint', 'platform', 'options',
              'properties', 'unlinkChoices', 'resetValues',
              'resetValuesComplete', 'missingResetValues', 'resolvedOptions',
              'candidateEvidence', 'cacheDirectoryVariant',
              'cacheDirectoryModernStatus', 'cacheDirectoryLegacyStatus',
              'cacheUnlinkVariant', 'cacheUnlinkModernStatus',
              'cacheUnlinkLegacyStatus', 'diskProfileReadBack',
              'memoryProfileReadBack', 'disabledProfileReadBack',
              'profileSwitchStrategy', 'diskCapabilityPassed',
          }
          assert set(manifest) == expected_top
          assert manifest['schema'] == 'emby-mpv-capabilities/v1'
          assert manifest['platform'] == 'iPadOS'
          assert isinstance(manifest['mpvVersionFingerprint'], str)
          assert manifest['mpvVersionFingerprint'].startswith('mpv-')
          expected_options = {
              'cache', 'cache-on-disk', 'demuxer-cache-dir',
              'cache-dir', 'demuxer-cache-unlink-files',
              'cache-unlink-files', 'cache-secs',
              'demuxer-max-bytes', 'demuxer-max-back-bytes',
              'demuxer-donate-buffer', 'demuxer-seekable-cache',
              'cache-pause', 'cache-pause-wait', 'stream-buffer-size',
          }
          expected_candidates = {
              'cache': ['cache'],
              'cacheOnDisk': ['cache-on-disk'],
              'cacheDirectory': ['demuxer-cache-dir', 'cache-dir'],
              'cacheUnlinkFiles': [
                  'demuxer-cache-unlink-files', 'cache-unlink-files'
              ],
              'cacheSeconds': ['cache-secs'],
              'forwardMetadataBytes': ['demuxer-max-bytes'],
              'backwardMetadataBytes': ['demuxer-max-back-bytes'],
              'donateBuffer': ['demuxer-donate-buffer'],
              'seekableCache': ['demuxer-seekable-cache'],
              'cachePause': ['cache-pause'],
              'cachePauseWait': ['cache-pause-wait'],
              'streamBufferSize': ['stream-buffer-size'],
          }
          candidate_keys = {
              'nativeName', 'status', 'optionNameMatches', 'optionExists',
              'resetAvailable', 'requiredChoiceAvailable',
              'writeReadBackPassed',
          }
          expected_properties = {
              'mpv-version', 'platform', 'property-list', 'demuxer-cache-state'
          }
          assert set(manifest['options']) == expected_options
          assert set(manifest['properties']) == expected_properties
          assert all(type(value) is bool for value in manifest['options'].values())
          assert all(type(value) is bool for value in manifest['properties'].values())
          reset_values = manifest['resetValues']
          assert set(reset_values).issubset(expected_options)
          assert all(isinstance(value, str) for value in reset_values.values())
          resolved = manifest['resolvedOptions']
          assert set(resolved).issubset(expected_candidates)
          assert all(
              value in expected_candidates[key]
              for key, value in resolved.items()
          )
          evidence = manifest['candidateEvidence']
          assert set(evidence) == set(expected_candidates)
          for logical, names in expected_candidates.items():
              records = evidence[logical]
              assert [record['nativeName'] for record in records] == names
              for record in records:
                  assert set(record) == candidate_keys
                  assert record['status'] in {'unavailable', 'incomplete', 'usable'}
                  assert all(
                      type(record[key]) is bool
                      for key in candidate_keys - {'nativeName', 'status'}
                  )
                  complete = (
                      record['optionNameMatches']
                      and record['optionExists']
                      and record['resetAvailable']
                      and record['requiredChoiceAvailable']
                      and record['writeReadBackPassed']
                  )
                  expected_status = (
                      'usable' if complete else
                      'unavailable' if not record['optionExists'] else
                      'incomplete'
                  )
                  assert record['status'] == expected_status
              selected = next(
                  (record['nativeName'] for record in records
                   if record['status'] == 'usable'),
                  None,
              )
              assert resolved.get(logical) == selected
          missing_resets = manifest['missingResetValues']
          assert set(missing_resets) == set(resolved.values()) - set(reset_values)
          resets_complete = not missing_resets
          assert manifest['resetValuesComplete'] is resets_complete
          for logical in ('cacheDirectory', 'cacheUnlinkFiles'):
              variant_key = (
                  'cacheDirectoryVariant' if logical == 'cacheDirectory'
                  else 'cacheUnlinkVariant'
              )
              selected = resolved.get(logical)
              expected_variant = (
                  'unavailable' if selected is None
                  else 'modern' if selected == expected_candidates[logical][0]
                  else 'legacy'
              )
              assert manifest[variant_key] == expected_variant
          assert manifest['cacheDirectoryModernStatus'] == evidence['cacheDirectory'][0]['status']
          assert manifest['cacheDirectoryLegacyStatus'] == evidence['cacheDirectory'][1]['status']
          assert manifest['cacheUnlinkModernStatus'] == evidence['cacheUnlinkFiles'][0]['status']
          assert manifest['cacheUnlinkLegacyStatus'] == evidence['cacheUnlinkFiles'][1]['status']
          assert type(manifest['diskProfileReadBack']) is bool
          assert type(manifest['memoryProfileReadBack']) is bool
          assert type(manifest['disabledProfileReadBack']) is bool
          assert manifest['memoryProfileReadBack'] is True
          assert manifest['disabledProfileReadBack'] is True
          approved_strategy = manifest['profileSwitchStrategy'] in {
              'inPlaceAfterMediaStop', 'requiresPlayerRecreation'
          }
          required_logical = {
              'cache', 'cacheOnDisk', 'cacheDirectory', 'cacheUnlinkFiles',
              'cacheSeconds', 'forwardMetadataBytes',
              'backwardMetadataBytes',
          }
          calculated_gate = (
              required_logical.issubset(resolved)
              and resets_complete
              and 'immediate' in manifest['unlinkChoices']
              and manifest['properties']['demuxer-cache-state']
              and manifest['diskProfileReadBack']
              and approved_strategy
          )
          assert manifest['diskCapabilityPassed'] is calculated_gate
          expected_disk_gate = (
              'PASSED' if calculated_gate else 'BLOCKED_BY_BUNDLED_LIBMPV'
          )
          expected_gate_keys = {
              'schema', 'cacheOptionBindingImplementation',
              'memoryCacheProfile', 'activeContextTelemetryReader',
              'diskCacheCapability', 'diskTelemetryEvidence',
          }
          assert set(gates) == expected_gate_keys
          assert gates['schema'] == 'emby-mpv-native-gates/v1'
          assert gates['cacheOptionBindingImplementation'] == 'PASSED'
          assert gates['memoryCacheProfile'] == 'PASSED'
          assert gates['activeContextTelemetryReader'] == 'PASSED'
          assert gates['diskCacheCapability'] == expected_disk_gate
          assert gates['diskTelemetryEvidence'] == expected_disk_gate
          gate_lines = [
              'STOP_GATE_CACHE_OPTION_BINDING_IMPLEMENTATION=PASSED',
              'STOP_GATE_MEMORY_CACHE_PROFILE=PASSED',
              'STOP_GATE_ACTIVE_CONTEXT_TELEMETRY_READER=PASSED',
              f'STOP_GATE_DISK_CACHE_CAPABILITY={expected_disk_gate}',
              f'STOP_GATE_DISK_TELEMETRY_EVIDENCE={expected_disk_gate}',
          ]
          gate_output.write_text('\n'.join(gate_lines) + '\n', encoding='utf-8')
          print('\n'.join(gate_lines))
          print(json.dumps(manifest, sort_keys=True, separators=(',', ':')))
          PY

      - name: Generate Runner entitlement mirrors
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/sync_entitlements.sh --runner-files
          git diff --exit-code -- \
            ios/Runner/DebugProfile.entitlements \
            ios/Runner/Release.entitlements

      - name: Validate iPad project settings and entitlements
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/validate_project_settings.sh
          bash scripts/ios/validate_entitlements.sh --xcode

      - name: Build unsigned device Runner.app
        run: bundle exec flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"

      - name: Check lock drift after iOS build
        shell: bash
        run: git diff --exit-code -- pubspec.lock ios/Podfile.lock

      - name: Install and verify Homebrew Core ldid 2.1.5
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/install_ldid.sh
          bash scripts/ios/verify_ldid.sh

      - name: Run packaging negative gates
        shell: bash
        run: bash scripts/ios/test_packaging_negative_gates.sh

      - name: Run entitlement policy negative gates
        shell: bash
        run: bash scripts/ios/test_entitlement_policy_negative_gates.sh

      - name: Create and verify TrollStore IPA
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          MPV_CAPABILITY_MANIFEST: build/ios/artifacts/mpv-capability-manifest.json
        run: bash scripts/ios/build_trollstore_ipa.sh

      - name: Verify portable IPA checksum
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios/artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          bash scripts/ios/verify_ipa_checksum.sh "$ipa_path" "$ipa_path.sha256"

      - name: Upload IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-ipa-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/ios/artifacts/*.ipa
            build/ios/artifacts/*.ipa.sha256

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-dsym-${{ github.run_number }}
          if-no-files-found: error
          path: build/ios/artifacts/*.dSYM.zip

      - name: Upload diagnostics and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: ios-core-diagnostics-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/ios/artifacts/*-diagnostics-*.zip
            build/ios/artifacts/*.txt
            build/ios/artifacts/*.json
            build/ios/artifacts/*.plist
            build/ios/artifacts/entitlements-fakesign/**
            build/ios/artifacts/entitlements-final/**
