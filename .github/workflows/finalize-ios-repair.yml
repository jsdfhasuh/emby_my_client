name: Prepare verified iPad repair objects

on:
  push:
    branches: [chatgpt/ios-strm-repair-20261107]
    paths: [.github/workflows/finalize-ios-repair.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify native source and prepare the workflow blob without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import urllib.request

          root = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def api(path, data=None):
              request = urllib.request.Request(root + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def git_hash(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          def read_blob(sha):
              value = api('/git/blobs/' + sha)
              content = base64.b64decode(value['content'])
              assert git_hash(content) == sha
              return content

          native_sha = '8586b523671a7b9752a4c8eabdb7d388be199dd8'
          read_blob(native_sha)
          workflow = read_blob('049ca97bd34bdb2b86678713ba203d915624605e').decode()
          # Construct the literal so this preparatory workflow does not interpolate it.
          expression = '$' + '{{ github.run_number }}-' + '$' + '{{ github.run_attempt }}'
          workflow, count = re.subn(r'name: ios-xctest-\d+-\d+', 'name: ios-xctest-' + expression, workflow)
          assert count == 1
          expected = 'e17e20c29ccd5661fdb4f5b9f7929632b3a6fcbb'
          assert git_hash(workflow.encode()) == expected
          result = api('/git/blobs', {'content': workflow, 'encoding': 'utf-8'})
          assert result['sha'] == expected
          summary = {'native_blob': native_sha, 'workflow_blob': expected,
                     'verified_run': 42334916502, 'branch_updated': False}
          print(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(summary, indent=2) + '\n```\n')
          PY
