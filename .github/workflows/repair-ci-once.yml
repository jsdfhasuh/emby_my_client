name: Validate playback CI repair

on:
  push:
    branches: [chatgpt/ci-repair-20261107]
    paths: [.github/workflows/repair-ci-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playback-ci-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.ref == 'refs/heads/chatgpt/ci-repair-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ci-repair-20261107
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - name: Apply guarded source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          base = '364bd064386530c9823c4b4fb8db247e893a9eb6'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          p = Path('lib/playback/playback_controller.dart')
          text = p.read_text()
          marker = '  static String friendlyPlaybackError(Object error) {'
          start = text.index(marker) + len(marker)
          end = text.index('    final message = error.toString().toLowerCase();', start)
          prefix = text[start:end]
          print('Original structured error handling:')
          print(prefix)
          prop = re.search(r'\b([A-Za-z_]\w*)\.(?:safeHttp|httpStatus)\b', prefix)
          if prop is None:
              raise RuntimeError('Expected structured HTTP error handling was not found')
          var = prop.group(1)
          if var == 'error':
              old_if = '    if (error is SourceInputException) {'
              if prefix.count(old_if) != 1:
                  raise RuntimeError('Unexpected direct exception handling')
              prefix = prefix.replace(old_if, '    if (sourceError != null) {', 1)
              prefix = re.sub(r'\berror\.(safeHttp|httpStatus|reason)\b', r'sourceError.\1', prefix)
              var = 'sourceError'
          else:
              guard = re.search(r'    if\s*\(\s*' + re.escape(var) + r'\s*!=\s*null\s*\)\s*\{', prefix)
              if guard is None:
                  raise RuntimeError('Expected nullable source error guard was not found')
              prefix = prefix[guard.start():]
          normalization = '\n    final SourceInputException? ' + var + ';\n' + (
              '    if (error is SourceInputException) {\n'
              '      VAR = error;\n'
              '    } else if (error is SourceInputFailure) {\n'
              '      VAR = error.error;\n'
              '    } else {\n'
              '      VAR = null;\n'
              '    }\n'
          ).replace('VAR', var)
          p.write_text(text[:start] + normalization + prefix + text[end:])
          regression = Path('test/playback_error_type_regression_test.dart')
          if regression.exists():
              raise RuntimeError('Regression test already exists')
          regression.write_text("""import 'package:emby_my_client/core/strm_diagnostics.dart';
          import 'package:emby_my_client/playback/playback_controller.dart';
          import 'package:emby_my_client/playback/source_input_failure.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('direct and wrapped source errors retain the HTTP status', () {
              const error = SourceInputException(
                'source_denied',
                stage: 'range_response',
                httpStatus: 403,
              );
              final failure = SourceInputFailure(
                error: error,
                trace: StrmTrace(),
                openAttempt: 1,
                request: 1,
                stale: false,
              );
              final direct = PlaybackController.friendlyPlaybackError(error);
              final wrapped = PlaybackController.friendlyPlaybackError(failure);
              expect(direct, contains('HTTP 403'));
              expect(wrapped, direct);
            });
          }
          """)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Fix only unused-import and wildcard diagnostics
        run: |
          dart fix --apply --code=unused_import,unnecessary_underscores lib
          dart fix --apply --code=unused_import,unnecessary_underscores test
      - name: Format changed Dart files
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          files = [p for p in changed if p.endswith('.dart') and p.startswith(('lib/', 'test/'))]
          files.append('test/playback_error_type_regression_test.dart')
          subprocess.run(['dart', 'format', *files], check=True)
          PY
      - name: Check whitespace and repository formatting
        run: |
          git diff --check
          dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze 2>&1 | tee ci-repair-analyze.log
      - name: Run complete Flutter test suite
        run: flutter test --reporter expanded 2>&1 | tee ci-repair-tests.log
      - name: Capture reviewable diff
        if: always()
        run: |
          git rev-parse HEAD > ci-repair-head.txt
          git diff -- lib test > ci-repair.patch
          git diff --stat -- lib test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-repair-source-and-logs
          path: |
            lib/
            test/
            pubspec.yaml
            pubspec.lock
            analysis_options.yaml
            ci-repair*.log
            ci-repair.patch
            ci-repair-head.txt
          retention-days: 3
      - name: Commit only verified source changes to repair branch
        shell: bash
        run: |
          git config user.name 'ChatGPT Web'
          git config user.email 'chatgpt-web@users.noreply.github.com'
          git add lib test
          git commit -m 'fix: preserve typed playback errors and resolve analyzer failures' -m 'ChatGPT Web: preserve structured playback errors and fix compiler-reported test lints. Verified with Flutter 3.38.9 format, analyze, and the full Flutter test suite.'
          git push origin HEAD:refs/heads/chatgpt/ci-repair-20261107
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
